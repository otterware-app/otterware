name: Build Mail iPhone artifact (manual)
# A signed archive for review; no store upload, release tag or main version mutation.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: otterware-mail-ios-build
  cancel-in-progress: false
jobs:
  build:
    name: Build signed archive (no upload)
      # The runner's default Xcode (a release, never a beta: App Store Connect
    # refuses beta builds).
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Install signing
        env:
          DISTRIBUTION_P12: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          NOTIFICATION_PROVISIONING_PROFILE: ${{ secrets.IOS_NOTIFICATION_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          for name in DISTRIBUTION_P12 DISTRIBUTION_P12_PASSWORD PROVISIONING_PROFILE NOTIFICATION_PROVISIONING_PROFILE; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing $name. Set the IOS_DISTRIBUTION_P12, IOS_DISTRIBUTION_P12_PASSWORD, IOS_PROVISIONING_PROFILE, IOS_NOTIFICATION_PROVISIONING_PROFILE secrets."
              exit 1
            fi
          done
          xcodebuild -version

          # The Apple Distribution identity, in a keychain of its own for this run.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$DISTRIBUTION_P12" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          security import "$RUNNER_TEMP/distribution.p12" -k "$keychain" -P "$DISTRIBUTION_P12_PASSWORD" -f pkcs12 -A
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/distribution.p12"

          # The "Otter Mail App Store" profile, where Xcode looks for profiles.
          printf '%s' "$PROVISIONING_PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          uuid="$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID raw -)"
          profiles="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$profiles"
          mv "$RUNNER_TEMP/profile.mobileprovision" "$profiles/$uuid.mobileprovision"
          printf '%s' "$NOTIFICATION_PROVISIONING_PROFILE" | base64 --decode > "$RUNNER_TEMP/notifications.mobileprovision"
          uuid="$(security cms -D -i "$RUNNER_TEMP/notifications.mobileprovision" | plutil -extract UUID raw -)"
          mv "$RUNNER_TEMP/notifications.mobileprovision" "$profiles/$uuid.mobileprovision"

      - name: Export bundled theme resources
        run: node native/mail-ios/scripts/export-ios-resources.ts

      - name: Archive the signed app without store submission
        run: |
          set -euo pipefail
          xcodebuild -project native/mail-ios/OtterMail.xcodeproj -scheme OtterMail \
            -configuration Release -destination generic/platform=iOS \
            -archivePath "$RUNNER_TEMP/OtterMail.xcarchive" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" -quiet archive
          ditto -c -k --keepParent "$RUNNER_TEMP/OtterMail.xcarchive" "$RUNNER_TEMP/OtterMail.xcarchive.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: otter-mail-ios-${{ github.sha }}
          path: ${{ runner.temp }}/OtterMail.xcarchive.zip
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
