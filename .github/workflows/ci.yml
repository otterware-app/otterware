name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan affected checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      affected: ${{ steps.plan.outputs.affected }}
      jobs: ${{ steps.plan.outputs.jobs }}
      lint: ${{ steps.plan.outputs.lint }}
      typecheck: ${{ steps.plan.outputs.typecheck }}
      build: ${{ steps.plan.outputs.build }}
      test: ${{ steps.plan.outputs.test }}
      test_web: ${{ steps.plan.outputs.test_web }}
      test_server: ${{ steps.plan.outputs.test_server }}
      rust: ${{ steps.plan.outputs.rust }}
      mobile_native_static_analysis: ${{ steps.plan.outputs.mobile_native_static_analysis }}
      release_smoke: ${{ steps.plan.outputs.release_smoke }}
      seams: ${{ steps.plan.outputs.seams }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - name: Test affected planning and aggregate policy
        run: node --test scripts/otterware/fast-loop.node-test.mjs
      - name: Plan affected checks
        id: plan
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          args=(--base "origin/$BASE_REF" --committed)
          if test "$GITHUB_EVENT_NAME" = push; then args+=(--all); fi
          node scripts/otterware/affected.mjs "${args[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: affected-check-plan
          path: .otterware-ci-plan.json
          include-hidden-files: true

  lint:
    needs: plan
    if: ${{ needs.plan.outputs.lint == 'true' }}
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Reject repository-owned PR assets
        run: |
          files="$(git ls-files .github/pr-assets)"
          if test -n "$files"; then
            printf 'PR evidence must be uploaded to GitHub, not committed:\n%s\n' "$files" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          name: affected-check-plan
          path: .

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/monorepo
              - --filter=@t3tools/oxlint-plugin-t3code

      - name: Install all workspaces for main dependency analysis
        if: ${{ github.event_name == 'push' }}
        run: vp install --frozen-lockfile

      - name: Ensure Electron for main dependency analysis
        if: ${{ github.event_name == 'push' }}
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Check changed files
        run: node scripts/otterware/check-changed.mjs --part lint

  typecheck:
    needs: plan
    if: ${{ needs.plan.outputs.typecheck == 'true' }}
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          name: affected-check-plan
          path: .

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        if: ${{ contains(fromJSON(needs.plan.outputs.affected), '@t3tools/desktop') }}
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Typecheck
        run: node scripts/otterware/check-changed.mjs --part typecheck

  build:
    needs: plan
    if: ${{ needs.plan.outputs.build == 'true' }}
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup-apt-mirrors

      # Runs in the background while Vite+ installs; the step before the build waits for it.
      - name: Start installing browser secret helper build libraries
        run: |
          (
            set +e
            sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config
            echo "$?" > "$RUNNER_TEMP/apt-status"
          ) > "$RUNNER_TEMP/apt.log" 2>&1 < /dev/null &

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Finish installing browser secret helper build libraries
        timeout-minutes: 5
        run: |
          until test -s "$RUNNER_TEMP/apt-status"; do sleep 1; done
          cat "$RUNNER_TEMP/apt.log"
          exit "$(cat "$RUNNER_TEMP/apt-status")"

      - name: Build desktop pipeline
        run: vp run build:desktop

      - name: Smoke-test emitted server runtime dependencies
        run: node scripts/release-smoke.ts --server-bundle

      - name: Verify preload bundle output
        run: node apps/desktop/scripts/verify-preload-bundle.mjs

  # Other affected packages share one runner; the local loop uses the same commands
  # sequentially so the shared development machine has bounded memory use.
  test:
    needs: plan
    if: ${{ needs.plan.outputs.test == 'true' }}
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      # Blacksmith boots GitHub's Ubuntu runner image (gcc is usually present),
      # but ACP process-tree live tests compile a small pthread fixture with `cc`
      # and soft-skip when it is missing. Install build-essential so that path
      # always runs in CI instead of silently no-oping.
      - name: Install C toolchain for process-tree fixtures
        if: ${{ contains(fromJSON(needs.plan.outputs.affected), 'effect-acp') }}
        run: |
          if ! command -v cc; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends build-essential
          fi

      - uses: ./.github/actions/setup-apt-mirrors

      # The desktop tests compile the browser secret helper. The install runs in
      # the background while Vite+ installs; the step before the tests waits for it.
      - name: Start installing browser secret helper build libraries
        if: ${{ contains(fromJSON(needs.plan.outputs.affected), '@t3tools/desktop') }}
        run: |
          (
            set +e
            sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config
            echo "$?" > "$RUNNER_TEMP/apt-status"
          ) > "$RUNNER_TEMP/apt.log" 2>&1 < /dev/null &

      - uses: actions/download-artifact@v8
        with:
          name: affected-check-plan
          path: .

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        if: ${{ contains(fromJSON(needs.plan.outputs.affected), '@t3tools/desktop') }}
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Finish installing browser secret helper build libraries
        if: ${{ contains(fromJSON(needs.plan.outputs.affected), '@t3tools/desktop') }}
        timeout-minutes: 5
        run: |
          until test -s "$RUNNER_TEMP/apt-status"; do sleep 1; done
          cat "$RUNNER_TEMP/apt.log"
          exit "$(cat "$RUNNER_TEMP/apt-status")"

      - name: Test
        run: node scripts/otterware/check-changed.mjs --part test

  # The web suite is the largest outside the server. In the shared Test job it
  # started last and ran alone for about 40s after everything else finished.
  test_web:
    needs: plan
    if: ${{ needs.plan.outputs.test_web == 'true' }}
    name: Test Web
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Test
        run: vp run --filter @t3tools/web test --maxWorkers=2

  # apps/server sets `fileParallelism: false`, so its test files run strictly
  # one at a time. Sharding spreads them over separate runners instead of
  # separate workers, so no two server test files ever share a machine and the
  # isolation that flag buys is preserved exactly. One file at a time keeps
  # about 1.5 cores busy, so 4 vCPU runners lose nothing against 8. The shards
  # split files by recorded duration (apps/server/src/testUtils/weightedShardSequencer.ts).
  test_server:
    needs: plan
    if: ${{ needs.plan.outputs.test_server == 'true' }}
    name: Test Server ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      # No Electron setup here: `t3` (apps/server) has no Electron dependency
      # and none of its tests touch the runtime. Only the non-server `test`
      # job, which covers @t3tools/desktop, needs the download.
      - name: Install Chromium for server browser integration tests
        run: node apps/server/node_modules/playwright-core/cli.js install --with-deps --only-shell chromium

      - name: Test
        env:
          T3CODE_TRANSFER_BUDGET_REPORT_PATH: ${{ runner.temp }}/t3code-transfer-budget.md
          T3CODE_TRANSFER_BUDGET_RESULT_PATH: ${{ runner.temp }}/thread-transfer-result.json
        run: vp run --filter t3 test --maxWorkers=2 --shard ${{ matrix.shard }}/${{ strategy.job-total }}

      # integration/transferBudgetV2.integration.test.ts writes the report; exactly one shard
      # produces these files. Gating the upload on their presence keeps a
      # single `thread-transfer-results` artifact per run, which is the name
      # thread-transfer-report.yml resolves.
      - name: Detect transfer budget report
        id: transfer_budget
        if: always()
        run: |
          if test -f "${{ runner.temp }}/thread-transfer-result.json"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish transfer budget report
        if: always() && steps.transfer_budget.outputs.present == 'true'
        run: |
          if test -f "${{ runner.temp }}/t3code-transfer-budget.md"; then
            tee -a "$GITHUB_STEP_SUMMARY" < "${{ runner.temp }}/t3code-transfer-budget.md"
          else
            echo "Transfer budget report was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload thread transfer result
        if: always() && steps.transfer_budget.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: thread-transfer-results
          path: ${{ runner.temp }}/thread-transfer-result.json
          if-no-files-found: ignore
          retention-days: 30

  transfer-report:
    name: Transfer report artifact
    needs: [plan, test_server]
    if: ${{ needs.plan.outputs.test_server == 'true' }}
    # On Blacksmith like every other job here: the GitHub-hosted queue is shared
    # with the PR bots and can leave this job waiting until it is abandoned,
    # which fails `Check` on an otherwise green run.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require transfer measurements
        uses: actions/download-artifact@v8
        with:
          name: thread-transfer-results
          path: ${{ runner.temp }}/thread-transfer

  # Split out of Check and Test: both paid ~7-9s to install a Rust toolchain
  # for checks that take under 3s, on the critical path of every PR.
  rust:
    needs: plan
    if: ${{ needs.plan.outputs.rust == 'true' }}
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Rust formatting
        run: |
          for crate in resource-monitor kde-snap-shot hyprland-snap-shot; do
            cargo fmt --manifest-path "native/$crate/Cargo.toml" -- --check
          done

      - name: Test Rust crates
        run: |
          for crate in resource-monitor kde-snap-shot hyprland-snap-shot; do
            cargo test --locked --manifest-path "native/$crate/Cargo.toml"
          done

  mobile_native_static_analysis:
    needs: plan
    if: ${{ needs.plan.outputs.mobile_native_static_analysis == 'true' }}
    name: Mobile Native Static Analysis
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Install mobile native static analysis tools
        run: brew bundle install --file apps/mobile/Brewfile

      - name: Lint mobile native sources
        run: vp run lint:mobile

  release_smoke:
    needs: plan
    if: ${{ needs.plan.outputs.release_smoke == 'true' }}
    name: Release Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Exercise release-only workflow steps
        run: node scripts/release-smoke.ts

  seams:
    name: Upstream seams
    needs: plan
    if: ${{ needs.plan.outputs.seams == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - name: Check upstream seams when installed
        run: |
          if test -f scripts/otterware/check-upstream-seams.ts; then
            node scripts/otterware/check-upstream-seams.ts
          fi

  # Require only this name in branch protection. Every omission must match the plan.
  check:
    name: CI gate
    if: ${{ always() }}
    needs:
      [
        plan,
        lint,
        typecheck,
        build,
        test,
        test_web,
        test_server,
        transfer-report,
        rust,
        mobile_native_static_analysis,
        release_smoke,
        seams,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: scripts/otterware
      - name: Require the plan to pass
        env:
          CI_GATE_RESULTS: ${{ toJSON(needs) }}
          CI_GATE_JOBS: ${{ needs.plan.outputs.jobs || '{}' }}
        run: node scripts/otterware/ci-gate.mjs
